<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<title>P2P 弹幕对战 · 局域网开房</title>
<style>
  :root{
    --bg:#0e1220; --bg2:#161d33; --card:#151b2e; --line:#2a3350;
    --fg:#e8ecf7; --dim:#8f9ab8; --accent:#4d8dff; --ok:#3ddc97; --warn:#ffb545; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%,#1d2748 0%,var(--bg) 60%) no-repeat,var(--bg);
    color:var(--fg); font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%; padding:20px 14px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:460px;margin:0 auto}
  header{text-align:center;margin:6px 0 18px}
  header h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:6px 0 0;color:var(--dim);font-size:13px}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .label{font-size:12px;color:var(--dim);letter-spacing:.4px;margin:0 0 6px}
  .addr{display:flex;gap:8px;align-items:center}
  .addr code{
    flex:1;min-width:0;display:block;padding:10px 12px;border-radius:10px;background:#0b1020;border:1px solid var(--line);
    font:14px/1.4 ui-monospace,Consolas,"Courier New",monospace;color:#cfe0ff;
    overflow-wrap:anywhere;user-select:all;-webkit-user-select:all;
  }
  .ghost{flex:none;padding:9px 12px;border-radius:10px;background:#1d2742;color:#cfe0ff;border:1px solid var(--line);font-size:13px;cursor:pointer}
  .ghost:active{transform:translateY(1px)}
  .qrbox{margin:16px auto 0;width:min(300px,74vw);aspect-ratio:1/1;background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;position:relative}
  .qrbox svg{width:100%;height:100%;display:block}
  .qrbox .ph{color:#5a6480;font-size:13px;text-align:center;padding:0 10px;line-height:1.7}
  .qrnote{margin:10px 0 0;text-align:center;color:var(--dim);font-size:12.5px}
  .btn{display:block;width:100%;margin:18px 0 0;padding:15px 16px;border:0;border-radius:12px;font-size:17px;font-weight:600;letter-spacing:.5px;
    color:#fff;background:linear-gradient(180deg,#5b9bff,#3d6fe0);box-shadow:0 6px 18px rgba(61,111,224,.35);cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{background:#2a3350;color:#7c86a4;box-shadow:none;cursor:not-allowed}
  .status{margin:12px 0 0;font-size:12.5px;color:var(--dim);text-align:center;min-height:19px}
  .warn{margin:12px 0 0;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.65;
    background:rgba(255,181,69,.10);border:1px solid rgba(255,181,69,.45);color:#ffd79a}
  .warn.err{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.45);color:#ffc0c0}
  .warn[hidden]{display:none}
  details{margin:16px 0 0;border-top:1px dashed var(--line);padding-top:12px}
  summary{cursor:pointer;color:var(--dim);font-size:13px;outline:none}
  .row{display:flex;gap:8px;margin-top:10px}
  .row input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;background:#0b1020;border:1px solid var(--line);color:var(--fg);font-size:14px}
  footer{margin:18px 0 0;text-align:center;color:#5f6a8a;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>P2P 弹幕对战</h1>
    <p>本机已开启局域网临时服务器 · 扫码即可加入</p>
  </header>

  <div class="card">
    <p class="label">局域网访问地址</p>
    <div class="addr">
      <code id="addr">正在获取…</code>
      <button id="copyBtn" class="ghost" type="button">复制</button>
    </div>

    <div class="qrbox" id="qrbox">
      <div class="ph" id="qrph">正在生成二维码…</div>
    </div>
    <p class="qrnote" id="qrnote">其他手机连到同一热点后扫码，用浏览器打开即可游玩</p>

    <div id="warnBar" class="warn" hidden></div>

    <button id="enterBtn" class="btn" type="button" disabled>进入游戏</button>
    <p class="status" id="status">正在检测运行环境…</p>

    <details>
      <summary>地址不对？手动指定局域网地址</summary>
      <div class="row">
        <input id="manualInput" type="text" inputmode="url" autocomplete="off" placeholder="例如 192.168.43.1:8080">
        <button id="manualApply" class="ghost" type="button">生成</button>
      </div>
    </details>
  </div>

  <footer>局域网直连 · 无需外网 · 服务器不做人数限制（前端 8 人软限制）</footer>
</div>

<script src="qrcode.js"></script>
<script src="landing.js"></script>
</body>
</html>
